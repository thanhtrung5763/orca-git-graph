name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Format check
        run: pnpm run format

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build the plugin
        run: node esbuild.js --production
